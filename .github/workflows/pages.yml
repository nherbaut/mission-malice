name: Publier Mission Malice sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les outils de test
        run: npm ci
      - name: Vérifier les règles du jeu
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        run: |
          mkdir -p /tmp/mission-malice-site
          cp index.html app.js game.js art.js styles.css favicon.svg /tmp/mission-malice-site/
          touch /tmp/mission-malice-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/mission-malice-site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
